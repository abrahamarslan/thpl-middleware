# ==============================================================================
# Tempo — single-binary trace backend, local storage, 14-day retention
# Receives OTLP from Alloy; queried by Grafana.
# ==============================================================================
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    block_retention: 336h       # 14 days of traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
