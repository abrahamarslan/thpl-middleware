# ==============================================================================
# Docker Compose — Core Platform (Zoho middleware)
# ==============================================================================
# Usage:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Security model:
#   - Base file publishes ONLY Traefik (80/443). Every other service is
#     reachable solely on internal Docker networks. Dev-only host ports live
#     in docker-compose.dev.yml.
#   - PDF rendering is in-process (typst-py) — no sidecar, no extra network.
#
# Networks:
#   app-frontend    Traefik <-> publicly routed services
#   app-backend     backend/workers <-> data stores & internal services
#   app-auth        Authentik <-> postgres/redis only
#   app-monitoring  Prometheus/Loki/Tempo/Alloy/Grafana + scrape targets
# ==============================================================================

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  # Swagger UI at ${API_PREFIX}/docs — off in production unless set true.
  DOCS_ENABLED: ${DOCS_ENABLED:-false}
  # Logging: the ENVIRONMENT above selects config/logging/environments/<env>.yaml,
  # which drives level/format. These are OPTIONAL ops overrides — leave empty to
  # let the YAML profile decide; set them to force a value across the stack.
  LOG_LEVEL: ${LOG_LEVEL:-}
  LOG_FORMAT: ${LOG_FORMAT:-}
  LOG_ENABLED: ${LOG_ENABLED:-}
  # Database (async driver)
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
  # Redis DB allocation: 0=cache, 1=authentik, 2=celery broker, 3=celery results
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/3
  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Meilisearch (ScoutBuilder queries from the API; indexing is CDC-driven)
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_MASTER_KEY: ${MEILISEARCH_KEY}
  # JWT
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
  JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
  # Authentik OIDC (users JIT-provisioned into the local users table)
  AUTHENTIK_ENABLED: ${AUTHENTIK_OIDC_ENABLED:-false}
  AUTHENTIK_ISSUER: ${AUTHENTIK_OIDC_ISSUER:-}
  AUTHENTIK_AUDIENCE: ${AUTHENTIK_OIDC_CLIENT_ID:-}
  # JWKS fetched via the internal network (auth.<domain> doesn't resolve in-container)
  AUTHENTIK_JWKS_URL: ${AUTHENTIK_OIDC_JWKS_URL:-}
  # Authentik Admin API (OUTBOUND user sync: app -> Authentik). The backend
  # reaches authentik-server via app-frontend, the workers via app-monitoring —
  # both already share a network with it, so the internal URL resolves for both.
  AUTHENTIK_SYNC_ENABLED: ${AUTHENTIK_SYNC_ENABLED:-false}
  AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-http://authentik-server:9000}
  AUTHENTIK_SERVICE_TOKEN: ${AUTHENTIK_SERVICE_TOKEN:-}
  # CORS
  CORS_ORIGINS: ${CORS_ORIGINS}
  CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
  # Zoho
  ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID}
  ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET}
  ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
  ZOHO_ACCOUNTS_URL: ${ZOHO_ACCOUNTS_URL:-https://accounts.zoho.in}
  ZOHO_API_BASE_URL: ${ZOHO_API_BASE_URL:-https://www.zohoapis.in/books/v3}
  ZOHO_ORGANIZATION_ID: ${ZOHO_ORGANIZATION_ID}
  # Zoho OAuth flow (must match the Zoho Connected App registration exactly)
  ZOHO_OAUTH_URL: ${ZOHO_OAUTH_URL:-https://accounts.zoho.in/oauth/v2/auth}
  ZOHO_ACCESS_TOKEN_URL: ${ZOHO_ACCESS_TOKEN_URL:-https://accounts.zoho.in/oauth/v2/token}
  ZOHO_REDIRECT_URL: ${ZOHO_REDIRECT_URL:-}
  ZOHO_SCOPE: ${ZOHO_SCOPE:-ZohoBooks.fullaccess.all}
  ZOHO_ACCESS_TYPE: ${ZOHO_ACCESS_TYPE:-offline}
  ZOHO_PROMPT: ${ZOHO_PROMPT:-Consent}
  # /initiate + /revoke require a JWT (default True). Set false in dev so the
  # consent screen opens directly in the browser. /callback is always JWT-free.
  ZOHO_AUTH_REQUIRE_USER: ${ZOHO_AUTH_REQUIRE_USER:-true}
  ZOHO_CALLBACK_REQUIRE_USER: ${ZOHO_CALLBACK_REQUIRE_USER:-false}
  # HMAC key for inbound Zoho webhooks (empty = signature check skipped, dev only)
  ZOHO_WEBHOOK_KEY_INCOMING: ${ZOHO_WEBHOOK_KEY_INCOMING:-}
  # Email (Resend)
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_DEFAULT_FROM: ${RESEND_DEFAULT_FROM:-Core Platform <noreply@example.com>}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  # Typst (in-process via typst-py; font/package dirs are baked into the image)
  TYPST_FONT_PATHS: ${TYPST_FONT_PATHS:-}
  TYPST_PDF_STANDARDS: ${TYPST_PDF_STANDARDS:-}
  MEDIA_DIR: /app/media
  # Rate limiting
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  # Observability
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318

services:

  # ============================================================================
  #  INFRASTRUCTURE — Traefik Reverse Proxy
  # ============================================================================
  traefik:
    image: traefik:v3.6.11
    container_name: traefik
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-UTC}
      # Pin Docker API version — Traefik's bundled Docker client may not
      # support the newest API. Without this, auto-negotiation can fail
      # silently and Traefik has zero routes (all 404).
      DOCKER_API_VERSION: "1.45"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./config/traefik/certs:/etc/traefik/certs:ro
      - traefik_certs:/letsencrypt
    networks:
      - app-frontend
      - app-monitoring
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: "Host(`traefik.${APP_DOMAIN:-app.local}`)"
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth@file
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  # ============================================================================
  #  DATA LAYER — PostgreSQL with PostGIS
  # ============================================================================
  postgres:
    build:
      context: ./config/postgres
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18-3.6--v2025.11.24}
        POSTGRES_MAJOR: ${POSTGRES_MAJOR:-18}
    image: core-platform-postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      PASSWORD_AUTHENTICATION: scram-sha-256
      POSTGRES_DBNAME: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,hstore,postgis_topology,pgrouting,pg_trgm,pgcrypto,pg_stat_statements,fuzzystrmatch,vector,pgaudit,pg_partman,ltree,uuid-ossp
      # Logical replication for Debezium CDC (zoho mirror tables -> Kafka).
      # shared_preload_libraries REPLACES kartoza's default — pg_cron MUST stay
      # in the list or kartoza's own `CREATE EXTENSION pg_cron` fails on first
      # boot and aborts the whole POSTGRES_MULTIPLE_EXTENSIONS loop.
      EXTRA_CONF: "wal_level = logical\nmax_wal_senders = 10\nmax_replication_slots = 10\nshared_preload_libraries = 'pg_cron,pg_stat_statements,pgaudit,pg_partman_bgw'"
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-backend
      - app-auth
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2.00" }

  # One-shot: creates the Authentik role & database
  postgres-init:
    image: postgres:17-alpine
    container_name: postgres-init
    restart: on-failure
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      AUTHENTIK_DB_NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - ./config/postgres/01-init-db.sh:/01-init-db.sh:ro
    # Strip Windows CRLF line-endings, then execute
    command: ["sh", "-c", "tr -d '\\r' < /01-init-db.sh > /tmp/init.sh && bash /tmp/init.sh"]
    networks:
      - app-backend
      - app-auth
    depends_on:
      postgres:
        condition: service_healthy

  # pg_dump backups EVERY 2 DAYS at 02:00 (POSTGRES_BACKUP_CRON)
  postgres-backup:
    image: kartoza/pg-backup:18-3.6--v2025.12.02
    container_name: postgres-backup
    restart: unless-stopped
    environment:
      DUMPPREFIX: PG
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: "5432"
      RUN_AS_ROOT: "true"
      CRON_SCHEDULE: ${POSTGRES_BACKUP_CRON:-0 2 */2 * *}
      REMOVE_BEFORE: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
      DBLIST: ${POSTGRES_DB} ${AUTHENTIK_DB_NAME:-authentik}
    volumes:
      - ./backups:/backups
    networks:
      - app-backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  DATA LAYER — Redis (cache, sessions, Celery broker)
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - app-backend
      - app-auth
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  DATA LAYER — ClickHouse (analytics; fed from Kafka domain events)
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: ${TZ:-UTC}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks:
      - app-backend
      - app-monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 4G, cpus: "2.00" }

  # ============================================================================
  #  DATA LAYER — MeiliSearch (product/customer search for the sales app)
  # ============================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - app-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.00" }

  # ============================================================================
  #  APPLICATION — Backend API (FastAPI, baked image)
  # ============================================================================
  backend:
    build:
      context: ../backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: core-platform-backend:latest
    container_name: backend
    restart: unless-stopped
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers ${WORKERS:-4} --no-access-log
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: core-platform-backend
    volumes:
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-frontend
      - app-backend
      - app-monitoring
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`${APP_DOMAIN:-app.local}`) && PathPrefix(`${API_PREFIX:-/api}`)"
      traefik.http.routers.api.priority: "10"
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.middlewares: security-headers@file,gzip@file
      traefik.http.services.api.loadbalancer.server.port: "8000"
    deploy:
      resources:
        limits: { memory: 1G, cpus: "2.00" }

  # ============================================================================
  #  ASYNC — Celery Worker (queues: default, integrations, documents)
  # ============================================================================
  # Used for: Zoho catalog/contact syncs, PDF generation via Typst,
  # order push-to-Zoho, route optimisation jobs (OR-Tools), media cleanup.
  # ============================================================================
  celery-worker:
    build:
      context: ../backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: core-platform-backend:latest
    container_name: celery-worker
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app worker
      -Q default,integrations,documents
      -c ${CELERY_CONCURRENCY:-4} -l ${LOG_LEVEL:-INFO}
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: core-platform-worker
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-backend
      - app-monitoring
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "2.00" }

  # ============================================================================
  #  ASYNC — Celery Beat (periodic scheduler — replaces APScheduler)
  # ============================================================================
  # Schedules: zoho-sync-items (*/15m), zoho-sync-contacts (2h), media cleanup.
  # Exactly ONE beat instance must run. Never scale this service.
  # ============================================================================
  celery-beat:
    build:
      context: ../backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: core-platform-backend:latest
    container_name: celery-beat
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app beat
      -l ${LOG_LEVEL:-INFO}
      --schedule /tmp/celerybeat-schedule
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-backend
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  # ============================================================================
  #  ASYNC — Flower (Celery dashboard: https://<domain>/flower, basic-auth)
  # ============================================================================
  flower:
    build:
      context: ../backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: core-platform-backend:latest
    container_name: flower
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app flower
      --port=5555 --url_prefix=flower
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-frontend
      - app-backend
    labels:
      traefik.enable: "true"
      traefik.http.routers.flower.rule: "Host(`${APP_DOMAIN:-app.local}`) && PathPrefix(`/flower`)"
      traefik.http.routers.flower.entrypoints: websecure
      traefik.http.routers.flower.tls: "true"
      traefik.http.routers.flower.middlewares: dashboard-auth@file
      traefik.http.services.flower.loadbalancer.server.port: "5555"
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  # ============================================================================
  #  ASYNC — Celery Prometheus Exporter (task throughput/latency/failures)
  # ============================================================================
  celery-exporter:
    image: danihodovic/celery-exporter:0.10.12   # pin: update deliberately
    container_name: celery-exporter
    restart: unless-stopped
    command: ["--broker-url=redis://:${REDIS_PASSWORD}@redis:6379/2"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-backend
      - app-monitoring
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }

  # ============================================================================
  #  ASYNC — Kafka Exporter (consumer lag, partition health)
  # ============================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-backend
      - app-monitoring
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }

  # ============================================================================
  #  SEARCH — CDC indexer (Kafka -> Meilisearch)
  # ============================================================================
  # Standalone consumer: Debezium streams row changes from the zoho mirror
  # tables into Kafka; this service batch-upserts them into Meilisearch.
  # The app never double-writes to the search engine (WAL is the source).
  # ============================================================================
  search-indexer:
    build:
      context: ../backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: core-platform-backend:latest
    container_name: search-indexer
    restart: unless-stopped
    command: python -m app.modules.search.indexer
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: core-platform-search-indexer
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_KEY}
      SEARCH_CDC_TOPICS: ${SEARCH_CDC_TOPICS:-zoho-mirror.public.zoho_organizations}
    depends_on:
      kafka:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - app-backend
      - app-monitoring
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  APPLICATION — Frontend (React + nginx)
  # ============================================================================
  frontend:
    build:
      context: ${FRONTEND_PATH:-../frontend}
      dockerfile: ../deployment/frontend/Dockerfile
      target: production
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        VITE_API_URL: ${API_PREFIX:-/api}
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-frontend
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "Host(`${APP_DOMAIN:-app.local}`)"
      traefik.http.routers.frontend.priority: "1"
      traefik.http.routers.frontend.entrypoints: websecure
      traefik.http.routers.frontend.tls: "true"
      traefik.http.routers.frontend.middlewares: security-headers@file,gzip@file
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  # ============================================================================
  #  REAL-TIME — Soketi WebSocket Server (Pusher protocol)
  # ============================================================================
  # Order status to the sales app, live driver location to dispatch screens.
  # Routed through Traefik at wss://ws.<domain>. Metrics on :9601 (internal).
  # ============================================================================
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: soketi
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: "false"
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID:-app}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET}
      SOKETI_METRICS_ENABLED: "1"
      SOKETI_METRICS_SERVER_PORT: "9601"
      SOKETI_ADAPTER_DRIVER: redis
      SOKETI_DB_REDIS_HOST: redis
      SOKETI_DB_REDIS_PORT: "6379"
      SOKETI_DB_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-frontend
      - app-backend
      - app-monitoring
    labels:
      traefik.enable: "true"
      traefik.http.routers.soketi.rule: "Host(`ws.${APP_DOMAIN:-app.local}`)"
      traefik.http.routers.soketi.entrypoints: websecure
      traefik.http.routers.soketi.tls: "true"
      traefik.http.services.soketi.loadbalancer.server.port: "6001"
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.50" }

  # ============================================================================
  #  IAM — Authentik (SSO / OAuth2 / OIDC)
  # ============================================================================
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PORT: "6379"
      AUTHENTIK_REDIS__DB: "1"
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST:-mailhog}
      AUTHENTIK_EMAIL__PORT: "${AUTHENTIK_EMAIL_PORT:-1025}"
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL_PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: "${AUTHENTIK_EMAIL_USE_TLS:-false}"
      AUTHENTIK_EMAIL__USE_SSL: "${AUTHENTIK_EMAIL_USE_SSL:-false}"
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM:-authentik@${APP_DOMAIN:-app.local}}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app-frontend
      - app-auth
      - app-monitoring
    labels:
      traefik.enable: "true"
      traefik.http.routers.authentik.rule: "Host(`auth.${APP_DOMAIN:-app.local}`)"
      traefik.http.routers.authentik.entrypoints: websecure
      traefik.http.routers.authentik.tls: "true"
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.00" }

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: "5432"
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PORT: "6379"
      AUTHENTIK_REDIS__DB: "1"
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST:-mailhog}
      AUTHENTIK_EMAIL__PORT: "${AUTHENTIK_EMAIL_PORT:-1025}"
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL_USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL_PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: "${AUTHENTIK_EMAIL_USE_TLS:-false}"
      AUTHENTIK_EMAIL__USE_SSL: "${AUTHENTIK_EMAIL_USE_SSL:-false}"
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM:-authentik@${APP_DOMAIN:-app.local}}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app-auth
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.00" }

  # ============================================================================
  #  EVENT STREAMING — Kafka (KRaft mode; Zookeeper removed)
  # ============================================================================
  # Domain events (order placed, delivery completed, stock changed) flow to
  # ClickHouse for analytics. Single broker; scale to 3 for production HA.
  # ============================================================================
  # apache/kafka 3.9.1 — KRaft, env-driven, auto-formats storage on first boot
  # from CLUSTER_ID. MUST be >= 3.9.1: 3.9.0 has KAFKA-18281, which wrongly
  # rejects a CONTROLLER listener bound to 0.0.0.0 during storage format
  # ("advertised.listeners cannot use 0.0.0.0"). Fixed in 3.9.1 / 4.0.0.
  # (bitnami/kafka is no longer an option — Bitnami moved free tags to the
  #  unsupported bitnamilegacy/ repo in Aug 2025.)
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    environment:
      # Fixed cluster id so first-boot storage formatting is deterministic.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for inter-container, CONTROLLER for raft, EXTERNAL for host.
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # kafka-broker-api-versions.sh is a full JVM and kafka-run-class.sh honours
      # the container's KAFKA_HEAP_OPTS — so without the override below every probe
      # spawns a second 1G-heap JVM next to the broker, exceeds the cgroup memory
      # limit, and the probe JVM is OOM-killed → the container never goes healthy
      # even though the broker is fine. Clamp the probe heap; give the JVM time.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx128m -Xms64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 90s
    networks:
      - app-backend
    deploy:
      resources:
        limits: { memory: 2G, cpus: "2.00" }

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
    networks:
      - app-backend
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  EVENT STREAMING — Debezium (Kafka Connect, CDC)
  # ============================================================================
  # Streams row-level changes from PostgreSQL zoho mirror tables into Kafka
  # topics (zoho-mirror.public.<table>), from where ClickHouse ingests them
  # for analytics. Register connectors: ./manage.sh register-debezium
  # ============================================================================
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: core-platform-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Plain JSON payloads — without this, every message is wrapped in a
      # {schema, payload} envelope that consumers (search-indexer,
      # ClickHouse ingestion) would have to unwrap.
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "1.00" }

  # ============================================================================
  #  OBSERVABILITY — Prometheus (metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    networks:
      - app-monitoring
      - app-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.00" }

  # postgres-exporter and redis-exporter removed — Alloy's built-in
  # prometheus.exporter.postgres / .redis components handle these metrics
  # and push them via remote_write.

  # ============================================================================
  #  OBSERVABILITY — Loki (logs)
  # ============================================================================
  loki-init:
    image: busybox:1.37
    container_name: loki-init
    restart: "no"
    command: ["sh", "-c", "chown -R 10001:10001 /loki"]
    volumes:
      - loki_data:/loki

  loki:
    image: grafana/loki:3.4.3
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yaml
    depends_on:
      loki-init:
        condition: service_completed_successfully
    networks:
      - app-monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  OBSERVABILITY — Tempo (distributed traces)
  # ============================================================================
  tempo-init:
    image: busybox:1.37
    container_name: tempo-init
    restart: "no"
    command: ["sh", "-c", "chown -R 10001:10001 /var/tempo"]
    volumes:
      - tempo_data:/var/tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    networks:
      - app-monitoring
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.00" }

  # ============================================================================
  #  OBSERVABILITY — Grafana Alloy (collector: container logs -> Loki,
  #  OTLP traces from backend/workers -> Tempo)
  # ============================================================================
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    environment:
      ALLOY_POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      ALLOY_REDIS_ADDR: "redis:6379"
      ALLOY_REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      # Host filesystem mounts for prometheus.exporter.unix (node_exporter)
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-monitoring
      - app-backend
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  OBSERVABILITY — Grafana (dashboards: metrics + logs + traces)
  # ============================================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "https://${APP_DOMAIN:-app.local}/grafana"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-monitoring
      - app-frontend
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`${APP_DOMAIN:-app.local}`) && PathPrefix(`/grafana`)"
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls: "true"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.50" }

  # ============================================================================
  #  UTILITIES — Volume backup (non-DB stateful volumes, every 2 days)
  # ============================================================================
  # PostgreSQL is NOT backed up here — copying live DB files is unsafe.
  # postgres-backup (pg_dump) owns database backups.
  # ============================================================================
  backup:
    image: offen/docker-volume-backup:v2
    container_name: backup
    restart: unless-stopped
    environment:
      BACKUP_FILENAME: volumes-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: volumes-
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON:-0 3 */2 * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - grafana_data:/backup/grafana:ro
      - authentik_media:/backup/authentik-media:ro
      - meilisearch_data:/backup/meilisearch:ro
      - ./backups:/archive
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }

  # ============================================================================
  #  INFRASTRUCTURE — acme-dns (production DNS-01 TLS only)
  # ============================================================================
  acmedns:
    image: joohoi/acme-dns:latest
    container_name: acmedns
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${ACMEDNS_API_PORT:-8053}:80"
    volumes:
      - acmedns_data:/var/lib/acme-dns
      - ./config/acmedns/config.cfg:/etc/acme-dns/config.cfg:ro
    networks:
      - app-backend
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: app_postgres_data
  redis_data:
    name: app_redis_data
  clickhouse_data:
    name: app_clickhouse_data
  meilisearch_data:
    name: app_meilisearch_data
  kafka_data:
    name: app_kafka_data
  backend_media:
    name: app_backend_media
  traefik_certs:
    name: app_traefik_certs
  authentik_media:
    name: app_authentik_media
  authentik_templates:
    name: app_authentik_templates
  grafana_data:
    name: app_grafana_data
  prometheus_data:
    name: app_prometheus_data
  loki_data:
    name: app_loki_data
  tempo_data:
    name: app_tempo_data
  alloy_data:
    name: app_alloy_data
  acmedns_data:
    name: app_acmedns_data

# ==============================================================================
# Networks
# ==============================================================================
networks:
  app-frontend:
    name: app-frontend
  app-backend:
    name: app-backend
  app-auth:
    name: app-auth
  app-monitoring:
    name: app-monitoring
